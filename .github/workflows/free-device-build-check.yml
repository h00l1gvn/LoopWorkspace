name: Free unsigned iPhone archive check

# Manual compile check only. No installation or pump interaction.
'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-device-build-check
  cancel-in-progress: false

jobs:
  archive:
    # Fail closed before allocating a runner if repository visibility is missing,
    # private, or internal. Standard runners are free for public repositories.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      UPSTREAM_REVISION: abfa1cd21a431372f6a890b11662acee90a2ea03

    steps:
      - name: Confirm public repository and required Xcode
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              repository = json.load(stream).get('repository', {})
          if repository.get('private') is not False or repository.get('visibility') != 'public':
              raise SystemExit('Refusing to run outside a public repository.')
          print('Confirmed public repository; standard macos-26 runner only.')
          PY
          if [ ! -d "$DEVELOPER_DIR" ]; then
            printf '::error::Required Xcode 26.5 is unavailable on this macos-26 runner. No fallback version will be selected.\n'
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Fetch unchanged pinned upstream source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: LoopKit/LoopWorkspace
          ref: abfa1cd21a431372f6a890b11662acee90a2ea03
          path: source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Verify and record source revisions
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$UPSTREAM_REVISION"
          test -z "$(git status --porcelain)"
          git log -1 --format='Workspace: %H (%cI) %s'
          git submodule status --recursive
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && test -z "$(git status --porcelain)"'
          {
            printf 'Pinned workspace: `%s`\n\n' "$UPSTREAM_REVISION"
            printf 'Recursive submodule revisions:\n\n```text\n'
            git submodule status --recursive
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile an unsigned generic iPhone archive
        id: compile
        working-directory: source
        run: |
          archive_path="$RUNNER_TEMP/Loop-unsigned.xcarchive"
          # The stock identifier contains DEVELOPMENT_TEAM. Supply neutral
          # compile-only metadata because there is no Apple team in this job.
          # Preserve stock source, entitlements, and clinical build settings.
          set +e
          xcodebuild archive \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/Loop-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Loop-source-packages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            EXPANDED_CODE_SIGN_IDENTITY= \
            EXPANDED_CODE_SIGN_IDENTITY_NAME= \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            LOOP_DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= \
            MAIN_APP_BUNDLE_IDENTIFIER=org.loopkit.unsignedbuildcheck \
            2>&1 | tee "$RUNNER_TEMP/Loop-unsigned-build.log"
          compiler_status=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$compiler_status" >> "$GITHUB_OUTPUT"
          printf 'xcodebuild archive exit code: %s\n' "$compiler_status"
          if [ "$compiler_status" -ne 0 ]; then
            exit "$compiler_status"
          fi

          app_path="$archive_path/Products/Applications/Loop.app"
          test -d "$app_path"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test -s "$app_path/$executable_name"
          file "$app_path/$executable_name"
          if codesign --display "$app_path" 2> "$RUNNER_TEMP/Loop-signature-check.log"; then
            printf '::error::The main app unexpectedly has a signature.\n'
            exit 1
          fi
          cat "$RUNNER_TEMP/Loop-signature-check.log"
          test ! -e "$app_path/embedded.mobileprovision"
          printf 'Verified an unsigned main app exists in the generic iOS archive.\n'

      - name: Record result without retaining build artifacts
        if: ${{ always() }}
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          COMPILER_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          {
            printf '\nCompile step: **%s**\n\n' "$COMPILE_OUTCOME"
            printf 'Compiler exit code: `%s`\n\n' "${COMPILER_EXIT_CODE:-not available}"
            printf 'This check does not establish phone installation, free-account signing compatibility, or runtime/pump reliability.\n\n'
            printf 'No app, archive, cache, or build log is uploaded as an artifact. Build products remain only on the temporary runner.\n'
          } >> "$GITHUB_STEP_SUMMARY"
